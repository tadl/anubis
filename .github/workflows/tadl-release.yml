name: Publish approved TADL release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful TADL release build run to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tadl-release-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'tadl/anubis' && startsWith(github.ref, 'refs/heads/tadl/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download successful TADL build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > run.json
          jq -e --arg repo "$GH_REPO" '
            .status == "completed" and .conclusion == "success" and
            (.event == "push" or .event == "workflow_dispatch") and
            .path == ".github/workflows/tadl-build.yml" and
            .head_repository.full_name == $repo and
            (.head_branch | startswith("tadl/"))
          ' run.json > /dev/null
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID/artifacts" > artifacts.json
          jq -e '
            .total_count == 1 and (.artifacts | length) == 1 and
            .artifacts[0].expired == false and
            (.artifacts[0].name | test("^anubis-[0-9.]+-tadl[0-9]+-linux-amd64$"))
          ' artifacts.json > /dev/null
          artifact_name="$(jq -r '.artifacts[0].name' artifacts.json)"
          gh run download "$BUILD_RUN_ID" --name "$artifact_name" --dir bundle

      - name: Verify package and release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path

          root = Path('bundle')
          metadata = json.loads((root / 'build.json').read_text())
          run = json.loads(Path('run.json').read_text())
          version = metadata['version']
          match = re.fullmatch(r'v([0-9]+\.[0-9]+\.[0-9]+)-tadl\.([1-9][0-9]*)', version)
          assert match, 'Invalid TADL release version'
          upstream, revision = match.groups()
          assert metadata['upstream_tag'] == 'v' + upstream
          assert re.fullmatch(r'[0-9a-f]{40}', metadata['source_commit'])
          assert metadata['source_commit'] == run['head_sha'], 'Artifact source differs from build run'
          assert re.fullmatch(r'[0-9a-f]{64}', metadata['binary_sha256'])
          deb_version = upstream + '+tadl' + revision
          package = 'anubis_' + deb_version + '_amd64.deb'
          expected = {package, 'SHA256SUMS', 'build.json'}
          assert {p.name for p in root.iterdir()} == expected, 'Unexpected release files'
          assert all(p.is_file() and not p.is_symlink() for p in root.iterdir())
          digest = hashlib.sha256((root / package).read_bytes()).hexdigest()
          assert (root / 'SHA256SUMS').read_text() == digest + '  ' + package + '\n', 'Package checksum mismatch'
          def field(name):
              return subprocess.check_output(['dpkg-deb', '--field', str(root / package), name], text=True).strip()
          assert field('Package') == 'anubis' and field('Version') == deb_version
          assert field('Architecture') == 'amd64'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RELEASE_TAG=' + version + '\nSOURCE_SHA=' + metadata['source_commit'] + '\n')
          Path('release-notes.md').write_text(
              'TADL-branded Anubis based on upstream ' + metadata['upstream_tag'] + '.\n\n'
              'Source commit: `' + metadata['source_commit'] + '`\n\n'
              'Promoted without rebuilding from [successful build ' + str(run['id']) + '](' + run['html_url'] + ').\n\n'
              'Assets: Linux amd64 Debian package, SHA256SUMS, and build.json.\n'
              'Publishing this release does not install or deploy it.\n')
          PY

      - name: Publish without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" > tags.json
          jq -e --arg ref "refs/tags/$RELEASE_TAG" 'all(.[]; .ref != $ref)' tags.json > /dev/null
          gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --draft \
            --title "TADL Anubis $RELEASE_TAG" --notes-file release-notes.md
          gh release upload "$RELEASE_TAG" bundle/*.deb bundle/SHA256SUMS bundle/build.json
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          release = json.loads(Path('release.json').read_text())
          expected = {p.name: 'sha256:' + hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('bundle').iterdir()}
          actual = {a['name']: a['digest'] for a in release['assets'] if a['state'] == 'uploaded'}
          assert release['draft'] and actual == expected, 'Uploaded assets do not match the approved build'
          PY
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
